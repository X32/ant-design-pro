# 前端镜像构建与推送 CI(跟后端共用 ACR、凭证、tag 策略)
#
# 触发条件:
#   1. 打 tag v* (推荐,版本号即发布) - 例如: git tag v1.0.0 && git push origin v1.0.0
#   2. workflow_dispatch - GitHub Actions 页面手动触发
#
# 必需 Secrets(跟后端仓库共用同一套):
#   ACR_USERNAME - 阿里云账号(用于 docker login)
#   ACR_PASSWORD - ACR 固定密码(访问凭证)
#
# 镜像 tag 策略(跟后端一致):
#   - <version>: 语义化版本号,例如 1.0.0(从 git tag 推导)
#   - <sha>:     git 短 SHA,方便追溯到具体 commit
#   - latest:    最新版本标签

name: Build and Push Frontend Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号(留空则用 git sha)'
        required: false
        default: ''

env:
  REGISTRY: crpi-40lskgiwx94n8wwz.cn-beijing.personal.cr.aliyuncs.com
  NAMESPACE: speakcube
  REPOSITORY: frontend

# 显式声明权限:GHA cache 写入需要 actions: write
permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # 从 v1.0.0 推导 1.0.0
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="manual-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
          echo "version=$VERSION"        >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA"          >> $GITHUB_OUTPUT
          echo "image=$IMAGE"            >> $GITHUB_OUTPUT
          echo ""
          echo "📦 准备推送:"
          echo "  $IMAGE:$VERSION"
          echo "  $IMAGE:$SHORT_SHA"
          echo "  $IMAGE:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          # ACR 个人版不支持 BuildKit 的 cacheconfig.v0 manifest,改用 GHA 原生缓存
          # (存 GitHub,10GB/仓库免费,内网传输更快,且不占 ACR 配额)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🚀 前端镜像推送完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | 镜像 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| version | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| sha | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ steps.meta.outputs.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**服务器部署命令**:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_TAG=${{ steps.meta.outputs.version }} docker compose -f docker-compose.prod.yml pull" >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_TAG=${{ steps.meta.outputs.version }} docker compose -f docker-compose.prod.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
