# ============================================
# 宝塔面板配置步骤总结
# ============================================
# 
# 1. 登录宝塔面板
# 2. 点击"网站" → 找到你的网站 → 点击"设置"
# 3. 点击"配置文件"
# 4. 找到 location / 部分，按照上面的配置修改
# 5. 点击"保存"
# 6. 如果提示配置错误，请仔细检查语法
# 7. 配置正确后，点击左侧"软件商店" → 找到 Nginx → 点击"重载配置"
# 
# ============================================
# 常见问题
# ============================================
# 
# Q: 刷新页面出现 404？
# A: 检查是否配置了 try_files $uri $uri/ /index.html;
# 
# Q: 静态资源加载失败？
# A: 检查文件路径和权限（chmod -R 755 /www/wwwroot/myapp）
# 
# Q: API 请求失败？
# A: 检查 proxy_pass 地址和后端服务是否启动
# 
# Q: 配置保存后 Nginx 启动失败？
# A: 检查配置语法，每行末尾要有分号，括号要匹配
# 
# ============================================
