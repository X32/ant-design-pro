# 本地开发 Nginx 配置
# 用于提供 HTTPS 反向代理到开发服务器

server {
    listen 443 ssl;
    http2 on;
    server_name localhost 192.168.4.30;  # 添加你的局域网 IP

    # SSL 证书配置
    ssl_certificate /Users/zhaoyang/Desktop/workPlace/Server.nosync/ant-design-pro/https/cert.pem;
    ssl_certificate_key /Users/zhaoyang/Desktop/workPlace/Server.nosync/ant-design-pro/https/cert.key;

    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 文件上传大小限制（允许上传大文件，如 60 秒录音）
    client_max_body_size 100M;

    # WebSocket 代理到后端 WebSocket 服务器
    location /api/ws {
        proxy_pass http://127.0.0.1:9001/ws;
        
        # WebSocket 必需配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超时设置（更长的超时时间）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 反向代理到开发服务器
    location / {
        proxy_pass http://127.0.0.1:8001;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP 重定向到 HTTPS（可选）
server {
    listen 80;
    server_name localhost 192.168.4.30;  # 添加你的局域网 IP
    return 301 https://$server_name$request_uri;
}
