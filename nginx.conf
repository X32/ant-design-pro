# 容器内 nginx 配置(挂到 /etc/nginx/conf.d/default.conf)
# 反代目标用 Docker 服务名,依赖 docker-compose 的 sp-net 网络
# 来源:精简自 nginx-bt.conf(宝塔参考版),去掉宝塔特有部分

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============ Gzip ============
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/x-javascript
               application/xml application/xml+rss application/atom+xml
               image/svg+xml;

    # ============ SPA 路由兜底 ============
    # history 模式 + exportStatic:静态 HTML 找不到时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存,保证发版后立即生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ============ hashed 静态资源 ============
    # umi.js / umi.css / chunk-*.js / 字体 / 图片:1 年 immutable
    # config.ts 的 hash: true 保证改了就换文件名,缓存绝对安全
    location ~* \.(js|css|woff2?|ttf|eot|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 音频/视频:30 天
    location ~* \.(mp3|mp4|wav|ogg|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============ 业务 API → 后端 9002(同机 Docker 网络) ============
    location /api/ {
        proxy_pass http://backend:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 音频上传体积上限(跟后端 upload_max_size 对齐)
        client_max_body_size 100M;

        # LLM 评分等长请求超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # TODO: 对话服务 /api/v1/* 当前落到上面 /api/ 规则走 backend:9002 兜底。
    #       后端补上独立 conversation service (port 9019) 后,解开下面的规则:
    # location /api/v1/ {
    #     proxy_pass http://conversation:9019;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ============ 口语练习 WebSocket → spoken-flow 9001 ============
    location /ws {
        proxy_pass http://spoken-flow:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WS 长连接,7 天兜底防中间设备断
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ============ 安全:屏蔽隐藏文件(.git 等) ============
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
