# 前端生产 compose
# 启动: docker compose -f docker-compose.prod.yml up -d
# 切版本: IMAGE_TAG=1.2.3 docker compose -f docker-compose.prod.yml up -d
# 回滚: IMAGE_TAG=1.2.2 docker compose -f docker-compose.prod.yml up -d
#
# 前置条件:
#   1. 服务器已 docker login crpi-40lskgiwx94n8wwz.cn-beijing.personal.cr.aliyuncs.com
#      (跟后端同一个 ACR 凭证)
#   2. 后端 docker-compose.prod.yml 已经起过(创建了 sp-net 网络)
#      或手动 docker network create sp-net
#   3. .env 里 CORS_ALLOWED_ORIGINS 已包含本前端域名(后端校验跨域)
#
# 本地开发请改用 docker-compose.dev.yml(node + max dev + fastRefresh HMR)

name: spokenpro-frontend

services:
  frontend:
    image: crpi-40lskgiwx94n8wwz.cn-beijing.personal.cr.aliyuncs.com/speakcube/frontend:${IMAGE_TAG:-latest}
    container_name: sp-frontend
    restart: unless-stopped
    ports:
      # ⚠️ 服务器 80 端口被宝塔 nginx 占用(边缘 SSL 终止层),
      #    前端容器走 8088,由宝塔站点反代 HTTPS → http://127.0.0.1:8088
      - "8088:80"
    networks: [sp-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sp-net:
    # ⚠️ Docker 会给 compose 自创的网络加 project 前缀,实际名字是 spokenpro-monolith_sp-net
    #    (后端 docker-compose.prod.yml 的 name: spokenpro-monolith + 网络名 sp-net)
    #    用 name: 字段引用真实网络名,服务内部仍用 sp-net 别名
    name: spokenpro-monolith_sp-net
    external: true
