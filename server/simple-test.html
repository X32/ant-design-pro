<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1890ff;
            text-align: center;
        }
        .info {
            background-color: #f6f8fa;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .success {
            color: #52c41a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>简单测试页面</h1>
        <div class="info">
            <p>这是一个简单的测试页面，用于检查基本渲染是否正常。</p>
            <p>如果您能看到这个页面，说明基本的 HTML 渲染是正常的。</p>
            <p class="success">✓ 页面加载成功</p>
            <p>当前时间: <span id="current-time"></span></p>
        </div>
    </div>

    <script>
        document.getElementById('current-time').textContent = new Date().toLocaleString();
        console.log('简单测试页面加载完成');
    </script>
</body>
</html>
